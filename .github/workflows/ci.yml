name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning install.sh claude/statusline.sh lib/wizard.sh bin/agentline tests/run.sh
      - name: Tests
        run: tests/run.sh
