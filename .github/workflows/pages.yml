# The GitHub Pages site (site/), built from README.md and the latest release
# tag. It deploys when either changes on main and when a release is published.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "README.md", "docs/media/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # tags: the site shows the latest release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: node build.mjs
        working-directory: site
      # The video lives on the "media" prerelease (too big for git); the
      # site serves them itself.
      - run: gh release download media --pattern '*.mp4' --dir site/dist/media
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
